notes: |
  Bitbucket allows this update for the pull request's author with `REPO_READ`, and for anyone else only with `REPO_WRITE`. The documented OAuth setup grants `REPO_READ`, so updating another author's pull request needs `BITBUCKET_OAUTH_SCOPE=REPO_WRITE` (or a token issued with it). That scope applies to every token the server issues and also enables merge, decline, and comment deletion for all users. Every optional field keeps its current value when omitted, at least one must be given, and an empty `description` clears it. `reviewers` is replaced as a whole: pass the complete list to keep, add, or drop reviewers, and pass an empty list to remove them all. Omitting it leaves the list unchanged. The author and the participants cannot be changed here. Bitbucket removes reviewers (and possibly other fields) that an update request leaves out, so the tool reads the pull request first and sends its full current state with the changes applied (two requests). Because the current reviewers are re-sent, one who can no longer be added (for example a deactivated user) fails the update with a 409; pass `reviewers` without that user. `version` is still required: read it with `bitbucket_get_pull_request` first. If the pull request is at another version when the tool reads it, the update is refused without writing, and a change between the read and the write returns a 409. The response is checked against the submitted fields, except a non-empty reviewer list, because Bitbucket can omit the author. Its `version` is expected to be the sent one plus one. A body that differs is reported as an unconfirmed write.
