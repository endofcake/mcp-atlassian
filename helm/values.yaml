# Default values for mcp-atlassian
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/sooperset/mcp-atlassian
  pullPolicy: IfNotPresent
  tag: "0.20.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Transport mode: "stdio", "sse", or "streamable-http"
# For HTTP modes, service will be created automatically
transport: "stdio"

# Port for HTTP transport modes (sse or streamable-http)
port: 9000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  # Whether to create RBAC resources
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000
  annotations: {}

# Server TLS (HTTPS listener)
# Serve the HTTP transports (sse/streamable-http) over HTTPS by terminating TLS
# at the MCP server itself — useful for end-to-end encryption to the pod. The
# chart does NOT create or manage certificates: provide an existing Secret (for
# example one issued by cert-manager) holding the cert and key, and it is mounted
# read-only into the container and passed to the server via --ssl-certfile /
# --ssl-keyfile. Ignored under the 'stdio' transport (no network listener).
tls:
  enabled: false
  # Name of an existing Secret (PEM cert + key). Required when tls.enabled.
  secretName: ""
  # Keys within that Secret. Defaults match a kubernetes.io/tls Secret.
  certFileKey: tls.crt
  keyFileKey: tls.key
  # Mount point for the Secret inside the container.
  mountPath: /etc/mcp-atlassian/tls
  # File mode for the mounted cert/key, as a DECIMAL integer. 288 == octal 0440
  # (owner+group read, no world read) so the private key is not world-readable;
  # the app still reads it via the pod's fsGroup. Expressed in decimal to avoid
  # YAML octal-parsing ambiguity — set 384 for 0600, 256 for 0400.
  defaultMode: 288

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mcp-atlassian.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: mcp-atlassian-tls
  #    hosts:
  #      - mcp-atlassian.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# OAuth token persistence (only needed for OAuth flow with token refresh)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  # existingClaim: ""

# Authentication Mode: "api-token", "personal-token", "oauth", or "byot" (bring your own token)
authMode: "api-token"

# Confluence Configuration
confluence:
  enabled: true
  # For Cloud: https://your-company.atlassian.net/wiki
  # For Server/DC: https://confluence.your-company.com
  url: ""

  # Cloud authentication (when authMode: api-token)
  username: ""
  apiToken: ""

  # Server/DC authentication (when authMode: personal-token)
  personalToken: ""

  # SSL verification for Server/DC (set to false for self-signed certs)
  sslVerify: "true"

  # Space filter (comma-separated space keys)
  spacesFilter: ""

  # Custom headers (comma-separated key=value pairs)
  customHeaders: ""

# Jira Configuration
jira:
  enabled: true
  # For Cloud: https://your-company.atlassian.net
  # For Server/DC: https://jira.your-company.com
  url: ""

  # Cloud authentication (when authMode: api-token)
  username: ""
  apiToken: ""

  # Server/DC authentication (when authMode: personal-token)
  personalToken: ""

  # SSL verification for Server/DC
  sslVerify: "true"

  # Project filter (comma-separated project keys)
  projectsFilter: ""

  # Custom headers (comma-separated key=value pairs)
  customHeaders: ""

# Bitbucket Data Center Configuration
# Bitbucket DC uses OAuth 2.0 exclusively. Set bitbucket.authMode to "oauth"
# (client credentials) or "byot" (bring-your-own access token).
bitbucket:
  enabled: false
  # Base URL of the Bitbucket Data Center instance
  url: ""

  # Auth mode for Bitbucket DC: "oauth" or "byot"
  # "oauth"  — supply oauthClientId + oauthClientSecret
  # "byot"   — supply a pre-existing oauthAccessToken
  authMode: "oauth"

  # Full OAuth (authMode: oauth)
  oauthClientId: ""
  oauthClientSecret: ""

  # OAuth redirect URI (authMode: oauth). Must match the redirect registered on
  # the Bitbucket application link. Required when Bitbucket fronts the OAuth
  # proxy; without it the upstream resolver cannot start the authorization flow
  # and silently degrades to bearer-forwarding.
  oauthRedirectUri: "http://localhost:8080/callback"

  # OAuth scope(s) to request (authMode: oauth). Space/comma-separated, e.g.
  # "REPO_READ". Bitbucket-specific with no shared fallback, so leaving it empty
  # requests no scope.
  oauthScope: "REPO_READ"

  # BYO access token (authMode: byot)
  oauthAccessToken: ""

  # SSL verification (set to "false" for self-signed certs)
  sslVerify: "true"

  # Comma-separated project keys to restrict tool output
  projectsFilter: ""

  # Custom headers (comma-separated key=value pairs)
  customHeaders: ""

# OAuth 2.0 Configuration (Cloud only)
# Required when authMode: oauth or byot
oauth:
  # Cloud ID (from --oauth-setup wizard or known for your instance)
  cloudId: ""

  # For standard OAuth flow (authMode: oauth)
  clientId: ""
  clientSecret: ""
  redirectUri: "http://localhost:8080/callback"
  scope: "read:jira-work write:jira-work read:confluence-content.all write:confluence-content offline_access"

  # For BYOT mode (authMode: byot)
  # Provide pre-existing access token
  accessToken: ""

# OAuth Proxy + DCR Configuration
# Optional and disabled by default. When enabled, the server exposes
# discovery + DCR routes for MCP OAuth clients.
oauthProxy:
  enabled: false

  # Optional restrictions (comma-separated values)
  allowedClientRedirectUris: ""
  allowedGrantTypes: ""

  # Require consent page during OAuth authorize flow.
  requireConsent: true

# OAuth proxy client storage backend for registered clients.
# "default": use FastMCP default encrypted storage.
# "factory": load custom storage via import path.
oauthClientStorage:
  mode: "default" # default | factory
  factory:
    importPath: "" # e.g. "my_pkg.storage:create_store"
    # Optional JSON object passed to the factory.
    configJson: ""
    # Optionally source JSON from an existing secret key.
    configJsonSecret:
      name: ""
      key: "config.json"

# Proxy Configuration
proxy:
  enabled: false
  http: ""
  https: ""
  noProxy: "localhost,127.0.0.1"
  socks: ""

  # Service-specific proxy overrides
  confluence:
    http: ""
    https: ""
    noProxy: ""
  jira:
    http: ""
    https: ""
    noProxy: ""

# Server Configuration
config:
  # Read-only mode (disables all write operations)
  readOnlyMode: false

  # Enable verbose logging
  verbose: false

  # Very verbose logging (includes debug info)
  veryVerbose: false

  # Log to stdout instead of stderr
  loggingStdout: true

  # Comma-separated list of enabled tools
  # Leave empty to enable all tools
  # Example: "confluence_search,jira_get_issue,jira_search"
  enabledTools: ""

# Additional environment variables
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Additional secrets to mount
extraSecrets: []
  # - name: custom-secret
  #   mountPath: /etc/secrets
  #   readOnly: true
