{{- /* TLS/CA locals: defaulted so chart-1.0 value shapes (helm upgrade
     --reuse-values from a release without these maps) render, and mount
     paths canonicalized so the /app boundary cannot be bypassed with a
     noncanonical spelling. /app is the container workdir and the
     confinement root for caller-supplied file paths. */}}
{{- $tls := .Values.tls | default dict }}
{{- $caBundle := .Values.caBundle | default dict }}
{{- $tlsMount := clean ($tls.mountPath | default "/etc/mcp-atlassian/tls") }}
{{- $tlsCert := $tls.certFileKey | default "tls.crt" }}
{{- $tlsKey := $tls.keyFileKey | default "tls.key" }}
{{- $tlsMode := $tls.defaultMode | default 256 }}
{{- $caMount := clean ($caBundle.mountPath | default "/etc/mcp-atlassian/ca") }}
{{- $caKey := $caBundle.key | default "ca.crt" }}
{{- if $tls.enabled }}
{{- if not $tls.secretName }}
{{- fail "tls.secretName is required when tls.enabled is true; the chart mounts an existing Secret (e.g. from cert-manager) and does not create one." }}
{{- end }}
{{- if eq .Values.transport "stdio" }}
{{- fail "tls.enabled requires an HTTP transport (sse or streamable-http); stdio has no network listener for TLS to terminate on." }}
{{- end }}
{{- range $k := list $tlsCert $tlsKey }}
{{- if or (not $k) (eq $k ".") (eq $k "..") (contains "/" $k) }}
{{- fail "tls.certFileKey and tls.keyFileKey must be plain file names within the Secret (non-empty, no '/', not '.' or '..')." }}
{{- end }}
{{- end }}
{{- if not (isAbs $tlsMount) }}
{{- fail "tls.mountPath must be an absolute path." }}
{{- end }}
{{- if or (eq $tlsMount "/app") (hasPrefix "/app/" $tlsMount) }}
{{- fail "tls.mountPath must not be /app or a path under /app: the container workdir is the confinement root for caller-supplied file paths, so a key mounted there would be readable through the attachment/page-content tools." }}
{{- end }}
{{- end }}
{{- if $caBundle.secretName }}
{{- if or (not $caKey) (eq $caKey ".") (eq $caKey "..") (contains "/" $caKey) }}
{{- fail "caBundle.key must be a plain file name within the Secret (non-empty, no '/', not '.' or '..')." }}
{{- end }}
{{- if not (isAbs $caMount) }}
{{- fail "caBundle.mountPath must be an absolute path." }}
{{- end }}
{{- if or (eq $caMount "/app") (hasPrefix "/app/" $caMount) }}
{{- fail "caBundle.mountPath must not be /app or a path under /app: the container workdir is the confinement root for caller-supplied file paths." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-atlassian.fullname" . }}
  labels:
    {{- include "mcp-atlassian.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-atlassian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-atlassian.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-atlassian.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if ne .Values.transport "stdio" }}
        ports:
        - name: http
          containerPort: {{ .Values.port }}
          protocol: TCP
        {{- end }}
        args:
        {{- if ne .Values.transport "stdio" }}
        - --transport
        - {{ .Values.transport }}
        - --port
        - "{{ .Values.port }}"
        {{- if $tls.enabled }}
        - --ssl-certfile
        - {{ printf "%s/%s" $tlsMount $tlsCert | quote }}
        - --ssl-keyfile
        - {{ printf "%s/%s" $tlsMount $tlsKey | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.config.verbose }}
        - -v
        {{- end }}
        {{- if .Values.config.veryVerbose }}
        - -vv
        {{- end }}
        {{- if .Values.config.enabledTools }}
        - --enabled-tools
        - {{ .Values.config.enabledTools | quote }}
        {{- end }}
        env:
        {{- if $tls.enabled }}
        # Required by the HTTPS listener: the OS trust store injection is
        # client-side only and would reject every inbound TLS handshake, so
        # the server refuses to start with both enabled.
        - name: MCP_ATLASSIAN_USE_SYSTEM_TRUSTSTORE
          value: "false"
        {{- end }}
        {{- if $caBundle.secretName }}
        - name: REQUESTS_CA_BUNDLE
          value: {{ printf "%s/%s" $caMount $caKey | quote }}
        - name: SSL_CERT_FILE
          value: {{ printf "%s/%s" $caMount $caKey | quote }}
        {{- end }}
        {{- if eq .Values.authMode "external" }}
        - name: ATLASSIAN_EXTERNAL_AUTH_ENABLE
          value: "true"
        - name: IGNORE_HEADER_AUTH
          value: "true"
        {{- end }}
        # Confluence Configuration
        {{- if .Values.confluence.enabled }}
        - name: CONFLUENCE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-url
        {{- if eq .Values.authMode "api-token" }}
        - name: CONFLUENCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-username
        - name: CONFLUENCE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-api-token
        {{- else if eq .Values.authMode "personal-token" }}
        - name: CONFLUENCE_PERSONAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-personal-token
        {{- end }}
        {{- if .Values.confluence.sslVerify }}
        - name: CONFLUENCE_SSL_VERIFY
          value: {{ .Values.confluence.sslVerify | quote }}
        {{- end }}
        {{- if .Values.confluence.spacesFilter }}
        - name: CONFLUENCE_SPACES_FILTER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-spaces-filter
        {{- end }}
        {{- if .Values.confluence.customHeaders }}
        - name: CONFLUENCE_CUSTOM_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-custom-headers
        {{- end }}
        {{- if .Values.confluence.passthroughHeaders }}
        - name: CONFLUENCE_PASSTHROUGH_HEADERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-passthrough-headers
        {{- end }}
        {{- end }}

        # Jira Configuration
        {{- if .Values.jira.enabled }}
        - name: JIRA_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-url
        {{- if eq .Values.authMode "api-token" }}
        - name: JIRA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-username
        - name: JIRA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-api-token
        {{- else if eq .Values.authMode "personal-token" }}
        - name: JIRA_PERSONAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-personal-token
        {{- end }}
        {{- if .Values.jira.sslVerify }}
        - name: JIRA_SSL_VERIFY
          value: {{ .Values.jira.sslVerify | quote }}
        {{- end }}
        {{- if .Values.jira.projectsFilter }}
        - name: JIRA_PROJECTS_FILTER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-projects-filter
        {{- end }}
        {{- if .Values.jira.customHeaders }}
        - name: JIRA_CUSTOM_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-custom-headers
        {{- end }}
        {{- if .Values.jira.passthroughHeaders }}
        - name: JIRA_PASSTHROUGH_HEADERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-passthrough-headers
        {{- end }}
        {{- end }}

        # OAuth Configuration
        {{- if or (eq .Values.authMode "oauth") (eq .Values.authMode "byot") }}
        - name: ATLASSIAN_OAUTH_CLOUD_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-cloud-id
        {{- if eq .Values.authMode "oauth" }}
        - name: ATLASSIAN_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-client-id
        - name: ATLASSIAN_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-client-secret
        - name: ATLASSIAN_OAUTH_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-redirect-uri
        - name: ATLASSIAN_OAUTH_SCOPE
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-scope
        {{- else if eq .Values.authMode "byot" }}
        - name: ATLASSIAN_OAUTH_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-access-token
        {{- end }}
        {{- end }}

        # OAuth Proxy + DCR Configuration
        - name: ATLASSIAN_OAUTH_PROXY_ENABLE
          value: {{ ternary "true" "false" .Values.oauthProxy.enabled | quote }}
        - name: ATLASSIAN_OAUTH_REQUIRE_CONSENT
          value: {{ ternary "true" "false" .Values.oauthProxy.requireConsent | quote }}
        {{- if .Values.oauthProxy.allowedClientRedirectUris }}
        - name: ATLASSIAN_OAUTH_ALLOWED_CLIENT_REDIRECT_URIS
          value: {{ .Values.oauthProxy.allowedClientRedirectUris | quote }}
        {{- end }}
        {{- if .Values.oauthProxy.allowedGrantTypes }}
        - name: ATLASSIAN_OAUTH_ALLOWED_GRANT_TYPES
          value: {{ .Values.oauthProxy.allowedGrantTypes | quote }}
        {{- end }}

        # OAuth proxy client storage backend
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_MODE
          value: {{ .Values.oauthClientStorage.mode | quote }}
        {{- if eq .Values.oauthClientStorage.mode "factory" }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_FACTORY
          value: {{ .Values.oauthClientStorage.factory.importPath | quote }}
        {{- if .Values.oauthClientStorage.factory.configJsonSecret.name }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              name: {{ .Values.oauthClientStorage.factory.configJsonSecret.name | quote }}
              key: {{ .Values.oauthClientStorage.factory.configJsonSecret.key | quote }}
        {{- else if .Values.oauthClientStorage.factory.configJson }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_CONFIG_JSON
          value: {{ .Values.oauthClientStorage.factory.configJson | quote }}
        {{- end }}
        {{- end }}

        # Proxy Configuration
        {{- if .Values.proxy.enabled }}
        {{- if .Values.proxy.http }}
        - name: HTTP_PROXY
          value: {{ .Values.proxy.http }}
        {{- end }}
        {{- if .Values.proxy.https }}
        - name: HTTPS_PROXY
          value: {{ .Values.proxy.https }}
        {{- end }}
        {{- if .Values.proxy.noProxy }}
        - name: NO_PROXY
          value: {{ .Values.proxy.noProxy }}
        {{- end }}
        {{- if .Values.proxy.socks }}
        - name: SOCKS_PROXY
          value: {{ .Values.proxy.socks }}
        {{- end }}
        {{- if .Values.proxy.wpad.enabled }}
        - name: ATLASSIAN_PROXY_WPAD_ENABLE
          value: "true"
        {{- end }}
        {{- if .Values.proxy.wpad.url }}
        - name: ATLASSIAN_PROXY_WPAD_URL
          value: {{ .Values.proxy.wpad.url | quote }}
        {{- end }}
        {{- if .Values.proxy.confluence.http }}
        - name: CONFLUENCE_HTTP_PROXY
          value: {{ .Values.proxy.confluence.http }}
        {{- end }}
        {{- if .Values.proxy.confluence.https }}
        - name: CONFLUENCE_HTTPS_PROXY
          value: {{ .Values.proxy.confluence.https }}
        {{- end }}
        {{- if .Values.proxy.confluence.noProxy }}
        - name: CONFLUENCE_NO_PROXY
          value: {{ .Values.proxy.confluence.noProxy }}
        {{- end }}
        {{- if ne .Values.proxy.confluence.wpad.enabled nil }}
        - name: CONFLUENCE_PROXY_WPAD_ENABLE
          value: {{ ternary "true" "false" .Values.proxy.confluence.wpad.enabled | quote }}
        {{- end }}
        {{- if .Values.proxy.confluence.wpad.url }}
        - name: CONFLUENCE_PROXY_WPAD_URL
          value: {{ .Values.proxy.confluence.wpad.url | quote }}
        {{- end }}
        {{- if .Values.proxy.jira.http }}
        - name: JIRA_HTTP_PROXY
          value: {{ .Values.proxy.jira.http }}
        {{- end }}
        {{- if .Values.proxy.jira.https }}
        - name: JIRA_HTTPS_PROXY
          value: {{ .Values.proxy.jira.https }}
        {{- end }}
        {{- if .Values.proxy.jira.noProxy }}
        - name: JIRA_NO_PROXY
          value: {{ .Values.proxy.jira.noProxy }}
        {{- end }}
        {{- if ne .Values.proxy.jira.wpad.enabled nil }}
        - name: JIRA_PROXY_WPAD_ENABLE
          value: {{ ternary "true" "false" .Values.proxy.jira.wpad.enabled | quote }}
        {{- end }}
        {{- if .Values.proxy.jira.wpad.url }}
        - name: JIRA_PROXY_WPAD_URL
          value: {{ .Values.proxy.jira.wpad.url | quote }}
        {{- end }}
        {{- end }}

        # Server Configuration
        {{- if .Values.config.readOnlyMode }}
        - name: READ_ONLY_MODE
          value: "true"
        {{- end }}
        {{- if .Values.config.loggingStdout }}
        - name: MCP_LOGGING_STDOUT
          value: "true"
        {{- end }}
        {{- if .Values.config.veryVerbose }}
        - name: MCP_VERY_VERBOSE
          value: "true"
        {{- end }}

        # Extra environment variables
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        {{- if ne .Values.transport "stdio" }}
        readinessProbe:
          {{- if and $tls.enabled ((.Values.readinessProbe | default dict).httpGet) }}
          {{- /* The pod serves HTTPS, so the probe must too. Default the
                 scheme to HTTPS but let an explicit value win. */}}
          {{- $probe := deepCopy .Values.readinessProbe }}
          {{- $_ := set $probe.httpGet "scheme" (default "HTTPS" $probe.httpGet.scheme) }}
          {{- toYaml $probe | nindent 12 }}
          {{- else }}
          {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        {{- if and (eq .Values.authMode "oauth") .Values.persistence.enabled }}
        - name: oauth-tokens
          mountPath: /home/app/.mcp-atlassian
        {{- end }}
        {{- if $tls.enabled }}
        - name: tls-certs
          mountPath: {{ $tlsMount | quote }}
          readOnly: true
        {{- end }}
        {{- if $caBundle.secretName }}
        - name: ca-bundle
          mountPath: {{ $caMount | quote }}
          readOnly: true
        {{- end }}
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if and (eq .Values.authMode "oauth") .Values.persistence.enabled }}
      - name: oauth-tokens
        persistentVolumeClaim:
          claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{- else }}{{ include "mcp-atlassian.fullname" . }}{{- end }}
      {{- end }}
      {{- if $tls.enabled }}
      - name: tls-certs
        secret:
          secretName: {{ $tls.secretName | quote }}
          defaultMode: {{ $tlsMode }}
          # Project only the cert/key entries; a reused Secret may hold
          # unrelated keys that must not reach the pod filesystem.
          items:
          {{- range $k := uniq (list $tlsCert $tlsKey) }}
          - key: {{ $k | quote }}
            path: {{ $k | quote }}
          {{- end }}
      {{- end }}
      {{- if $caBundle.secretName }}
      - name: ca-bundle
        secret:
          secretName: {{ $caBundle.secretName | quote }}
          items:
          - key: {{ $caKey | quote }}
            path: {{ $caKey | quote }}
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
