{{- $bitbucket := .Values.bitbucket | default dict }}
{{- include "mcp-atlassian.validateBitbucket" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-atlassian.fullname" . }}
  labels:
    {{- include "mcp-atlassian.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-atlassian.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-atlassian.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-atlassian.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if ne .Values.transport "stdio" }}
        ports:
        - name: http
          containerPort: {{ .Values.port }}
          protocol: TCP
        {{- end }}
        args:
        {{- if ne .Values.transport "stdio" }}
        - --transport
        - {{ .Values.transport }}
        - --port
        - "{{ .Values.port }}"
        {{- end }}
        {{- if .Values.config.verbose }}
        - -v
        {{- end }}
        {{- if .Values.config.veryVerbose }}
        - -vv
        {{- end }}
        {{- if .Values.config.enabledTools }}
        - --enabled-tools
        - {{ .Values.config.enabledTools | quote }}
        {{- end }}
        env:
        {{- if eq .Values.authMode "external" }}
        - name: ATLASSIAN_EXTERNAL_AUTH_ENABLE
          value: "true"
        - name: IGNORE_HEADER_AUTH
          value: "true"
        {{- end }}
        # Confluence Configuration
        {{- if .Values.confluence.enabled }}
        - name: CONFLUENCE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-url
        {{- if eq .Values.authMode "api-token" }}
        - name: CONFLUENCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-username
        - name: CONFLUENCE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-api-token
        {{- else if eq .Values.authMode "personal-token" }}
        - name: CONFLUENCE_PERSONAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-personal-token
        {{- end }}
        {{- if .Values.confluence.sslVerify }}
        - name: CONFLUENCE_SSL_VERIFY
          value: {{ .Values.confluence.sslVerify | quote }}
        {{- end }}
        {{- if .Values.confluence.spacesFilter }}
        - name: CONFLUENCE_SPACES_FILTER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-spaces-filter
        {{- end }}
        {{- if .Values.confluence.customHeaders }}
        - name: CONFLUENCE_CUSTOM_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-custom-headers
        {{- end }}
        {{- if .Values.confluence.passthroughHeaders }}
        - name: CONFLUENCE_PASSTHROUGH_HEADERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: confluence-passthrough-headers
        {{- end }}
        {{- if .Values.confluence.timeout }}
        - name: CONFLUENCE_TIMEOUT
          value: {{ .Values.confluence.timeout | quote }}
        {{- end }}
        {{- end }}

        # Jira Configuration
        {{- if .Values.jira.enabled }}
        - name: JIRA_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-url
        {{- if eq .Values.authMode "api-token" }}
        - name: JIRA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-username
        - name: JIRA_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-api-token
        {{- else if eq .Values.authMode "personal-token" }}
        - name: JIRA_PERSONAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-personal-token
        {{- end }}
        {{- if .Values.jira.sslVerify }}
        - name: JIRA_SSL_VERIFY
          value: {{ .Values.jira.sslVerify | quote }}
        {{- end }}
        {{- if .Values.jira.projectsFilter }}
        - name: JIRA_PROJECTS_FILTER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-projects-filter
        {{- end }}
        {{- if .Values.jira.customHeaders }}
        - name: JIRA_CUSTOM_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-custom-headers
        {{- end }}
        {{- if .Values.jira.passthroughHeaders }}
        - name: JIRA_PASSTHROUGH_HEADERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: jira-passthrough-headers
        {{- end }}
        {{- if .Values.jira.timeout }}
        - name: JIRA_TIMEOUT
          value: {{ .Values.jira.timeout | quote }}
        {{- end }}
        {{- if .Values.jira.fetcherMaxWorkers }}
        - name: JIRA_FETCHER_MAX_WORKERS
          value: {{ .Values.jira.fetcherMaxWorkers | quote }}
        {{- end }}
        {{- end }}

        # Bitbucket Data Center Configuration
        {{- if $bitbucket.enabled }}
        - name: BITBUCKET_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-url
        {{- if eq $bitbucket.authMode "oauth" }}
        - name: BITBUCKET_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-oauth-client-id
        - name: BITBUCKET_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-oauth-client-secret
        - name: BITBUCKET_OAUTH_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-oauth-redirect-uri
        - name: BITBUCKET_OAUTH_SCOPE
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-oauth-scope
        {{- else if eq $bitbucket.authMode "byot" }}
        - name: BITBUCKET_OAUTH_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-oauth-access-token
        {{- end }}
        # Always emitted so a YAML boolean `false` (not just the string
        # "false") reaches the server; gating on truthiness would make the
        # verification opt-out unreachable.
        - name: BITBUCKET_SSL_VERIFY
          value: {{ $bitbucket.sslVerify | quote }}
        {{- if $bitbucket.projectsFilter }}
        - name: BITBUCKET_PROJECTS_FILTER
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-projects-filter
        {{- end }}
        {{- if $bitbucket.customHeaders }}
        - name: BITBUCKET_CUSTOM_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-custom-headers
        {{- end }}
        {{- if $bitbucket.passthroughHeaders }}
        - name: BITBUCKET_PASSTHROUGH_HEADERS
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: bitbucket-passthrough-headers
        {{- end }}
        {{- if $bitbucket.timeout }}
        - name: BITBUCKET_TIMEOUT
          value: {{ $bitbucket.timeout | quote }}
        {{- end }}
        {{- if $bitbucket.fetcherMaxWorkers }}
        - name: BITBUCKET_FETCHER_MAX_WORKERS
          value: {{ $bitbucket.fetcherMaxWorkers | quote }}
        {{- end }}
        {{- end }}

        # OAuth Configuration
        {{- if or (eq .Values.authMode "oauth") (eq .Values.authMode "byot") }}
        - name: ATLASSIAN_OAUTH_CLOUD_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-cloud-id
        {{- if eq .Values.authMode "oauth" }}
        - name: ATLASSIAN_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-client-id
        - name: ATLASSIAN_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-client-secret
        - name: ATLASSIAN_OAUTH_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-redirect-uri
        - name: ATLASSIAN_OAUTH_SCOPE
          valueFrom:
            configMapKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-scope
        {{- else if eq .Values.authMode "byot" }}
        - name: ATLASSIAN_OAUTH_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "mcp-atlassian.fullname" . }}
              key: oauth-access-token
        {{- end }}
        {{- end }}

        # OAuth Proxy + DCR Configuration
        - name: ATLASSIAN_OAUTH_PROXY_ENABLE
          value: {{ ternary "true" "false" .Values.oauthProxy.enabled | quote }}
        - name: ATLASSIAN_OAUTH_REQUIRE_CONSENT
          value: {{ ternary "true" "false" .Values.oauthProxy.requireConsent | quote }}
        {{- if .Values.oauthProxy.allowedClientRedirectUris }}
        - name: ATLASSIAN_OAUTH_ALLOWED_CLIENT_REDIRECT_URIS
          value: {{ .Values.oauthProxy.allowedClientRedirectUris | quote }}
        {{- end }}
        {{- if .Values.oauthProxy.allowedGrantTypes }}
        - name: ATLASSIAN_OAUTH_ALLOWED_GRANT_TYPES
          value: {{ .Values.oauthProxy.allowedGrantTypes | quote }}
        {{- end }}

        # OAuth proxy client storage backend
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_MODE
          value: {{ .Values.oauthClientStorage.mode | quote }}
        {{- if eq .Values.oauthClientStorage.mode "factory" }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_FACTORY
          value: {{ .Values.oauthClientStorage.factory.importPath | quote }}
        {{- if .Values.oauthClientStorage.factory.configJsonSecret.name }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_CONFIG_JSON
          valueFrom:
            secretKeyRef:
              name: {{ .Values.oauthClientStorage.factory.configJsonSecret.name | quote }}
              key: {{ .Values.oauthClientStorage.factory.configJsonSecret.key | quote }}
        {{- else if .Values.oauthClientStorage.factory.configJson }}
        - name: ATLASSIAN_OAUTH_CLIENT_STORAGE_CONFIG_JSON
          value: {{ .Values.oauthClientStorage.factory.configJson | quote }}
        {{- end }}
        {{- end }}

        # Proxy Configuration
        {{- if .Values.proxy.enabled }}
        {{- if .Values.proxy.http }}
        - name: HTTP_PROXY
          value: {{ .Values.proxy.http }}
        {{- end }}
        {{- if .Values.proxy.https }}
        - name: HTTPS_PROXY
          value: {{ .Values.proxy.https }}
        {{- end }}
        {{- if .Values.proxy.noProxy }}
        - name: NO_PROXY
          value: {{ .Values.proxy.noProxy }}
        {{- end }}
        {{- if .Values.proxy.socks }}
        - name: SOCKS_PROXY
          value: {{ .Values.proxy.socks }}
        {{- end }}
        {{- if .Values.proxy.wpad.enabled }}
        - name: ATLASSIAN_PROXY_WPAD_ENABLE
          value: "true"
        {{- end }}
        {{- if .Values.proxy.wpad.url }}
        - name: ATLASSIAN_PROXY_WPAD_URL
          value: {{ .Values.proxy.wpad.url | quote }}
        {{- end }}
        {{- if .Values.proxy.confluence.http }}
        - name: CONFLUENCE_HTTP_PROXY
          value: {{ .Values.proxy.confluence.http }}
        {{- end }}
        {{- if .Values.proxy.confluence.https }}
        - name: CONFLUENCE_HTTPS_PROXY
          value: {{ .Values.proxy.confluence.https }}
        {{- end }}
        {{- if .Values.proxy.confluence.noProxy }}
        - name: CONFLUENCE_NO_PROXY
          value: {{ .Values.proxy.confluence.noProxy }}
        {{- end }}
        {{- if ne .Values.proxy.confluence.wpad.enabled nil }}
        - name: CONFLUENCE_PROXY_WPAD_ENABLE
          value: {{ ternary "true" "false" .Values.proxy.confluence.wpad.enabled | quote }}
        {{- end }}
        {{- if .Values.proxy.confluence.wpad.url }}
        - name: CONFLUENCE_PROXY_WPAD_URL
          value: {{ .Values.proxy.confluence.wpad.url | quote }}
        {{- end }}
        {{- if .Values.proxy.jira.http }}
        - name: JIRA_HTTP_PROXY
          value: {{ .Values.proxy.jira.http }}
        {{- end }}
        {{- if .Values.proxy.jira.https }}
        - name: JIRA_HTTPS_PROXY
          value: {{ .Values.proxy.jira.https }}
        {{- end }}
        {{- if .Values.proxy.jira.noProxy }}
        - name: JIRA_NO_PROXY
          value: {{ .Values.proxy.jira.noProxy }}
        {{- end }}
        {{- if ne .Values.proxy.jira.wpad.enabled nil }}
        - name: JIRA_PROXY_WPAD_ENABLE
          value: {{ ternary "true" "false" .Values.proxy.jira.wpad.enabled | quote }}
        {{- end }}
        {{- if .Values.proxy.jira.wpad.url }}
        - name: JIRA_PROXY_WPAD_URL
          value: {{ .Values.proxy.jira.wpad.url | quote }}
        {{- end }}
        {{- $bitbucketProxy := .Values.proxy.bitbucket | default dict }}
        {{- $bitbucketWpad := $bitbucketProxy.wpad | default dict }}
        {{- if $bitbucketProxy.http }}
        - name: BITBUCKET_HTTP_PROXY
          value: {{ $bitbucketProxy.http | quote }}
        {{- end }}
        {{- if $bitbucketProxy.https }}
        - name: BITBUCKET_HTTPS_PROXY
          value: {{ $bitbucketProxy.https | quote }}
        {{- end }}
        {{- if $bitbucketProxy.noProxy }}
        - name: BITBUCKET_NO_PROXY
          value: {{ $bitbucketProxy.noProxy | quote }}
        {{- end }}
        {{- if ne $bitbucketWpad.enabled nil }}
        - name: BITBUCKET_PROXY_WPAD_ENABLE
          value: {{ ternary "true" "false" $bitbucketWpad.enabled | quote }}
        {{- end }}
        {{- if $bitbucketWpad.url }}
        - name: BITBUCKET_PROXY_WPAD_URL
          value: {{ $bitbucketWpad.url | quote }}
        {{- end }}
        {{- end }}

        # Server Configuration
        {{- if .Values.config.readOnlyMode }}
        - name: READ_ONLY_MODE
          value: "true"
        {{- end }}
        {{- if .Values.config.loggingStdout }}
        - name: MCP_LOGGING_STDOUT
          value: "true"
        {{- end }}
        {{- if .Values.config.veryVerbose }}
        - name: MCP_VERY_VERBOSE
          value: "true"
        {{- end }}

        # Extra environment variables
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

        {{- if ne .Values.transport "stdio" }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        {{- if include "mcp-atlassian.persistOAuthTokens" . }}
        - name: oauth-tokens
          mountPath: /home/app/.mcp-atlassian
        {{- end }}
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      {{- if include "mcp-atlassian.persistOAuthTokens" . }}
      - name: oauth-tokens
        persistentVolumeClaim:
          claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{- else }}{{ include "mcp-atlassian.fullname" . }}{{- end }}
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
