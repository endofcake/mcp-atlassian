{{- $bitbucket := .Values.bitbucket | default dict }}
{{- include "mcp-atlassian.validateBitbucket" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-atlassian.fullname" . }}
  labels:
    {{- include "mcp-atlassian.labels" . | nindent 4 }}
data:
  {{- if .Values.confluence.enabled }}
  confluence-url: {{ .Values.confluence.url | toString | trim | quote }}
  {{- if .Values.confluence.spacesFilter }}
  confluence-spaces-filter: {{ .Values.confluence.spacesFilter | quote }}
  {{- end }}
  {{- if .Values.confluence.passthroughHeaders }}
  confluence-passthrough-headers: {{ .Values.confluence.passthroughHeaders | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.jira.enabled }}
  jira-url: {{ .Values.jira.url | toString | trim | quote }}
  {{- if .Values.jira.projectsFilter }}
  jira-projects-filter: {{ .Values.jira.projectsFilter | quote }}
  {{- end }}
  {{- if .Values.jira.passthroughHeaders }}
  jira-passthrough-headers: {{ .Values.jira.passthroughHeaders | quote }}
  {{- end }}
  {{- end }}

  {{- if $bitbucket.enabled }}
  bitbucket-url: {{ $bitbucket.url | toString | trim | quote }}
  {{- if eq $bitbucket.authMode "oauth" }}
  bitbucket-oauth-redirect-uri: {{ $bitbucket.oauthRedirectUri | default "" | toString | trim | quote }}
  bitbucket-oauth-scope: {{ $bitbucket.oauthScope | default "" | toString | trim | quote }}
  {{- end }}
  {{- if $bitbucket.projectsFilter }}
  bitbucket-projects-filter: {{ $bitbucket.projectsFilter | quote }}
  {{- end }}
  {{- if $bitbucket.passthroughHeaders }}
  bitbucket-passthrough-headers: {{ $bitbucket.passthroughHeaders | quote }}
  {{- end }}
  {{- end }}

  {{- if eq .Values.authMode "oauth" }}
  oauth-redirect-uri: {{ .Values.oauth.redirectUri | quote }}
  oauth-scope: {{ .Values.oauth.scope | quote }}
  {{- end }}
